name: Full Stack CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            vinaysingh0912/myapp-frontend:${{ github.sha }}
            vinaysingh0912/myapp-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            vinaysingh0912/myapp-backend:${{ github.sha }}
            vinaysingh0912/myapp-backend:latest

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Diagnose EC2 host fingerprint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -eu
          echo "Checking ED25519 host key..."
          ssh-keyscan -T 10 -t ed25519 "$EC2_HOST" 2>/dev/null \
            | ssh-keygen -lf - -E sha256
      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: IMAGE_TAG,EC2_APP_DIR
          script: |
            set -eu

            cd "$EC2_APP_DIR"

            export IMAGE_TAG

            docker compose config -q
            docker compose pull frontend backend
            docker compose up -d --no-build frontend backend

            docker compose ps
